apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ai-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: praxis-ai-gateway-lab
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ai-allow-required-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mock-backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-backend-allow-praxis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mock-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ai
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ui-allow-required-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 7860
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: praxis-ai
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
