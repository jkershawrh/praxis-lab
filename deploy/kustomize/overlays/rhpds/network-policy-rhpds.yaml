apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-ai-allow-rhpds-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-ai
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

