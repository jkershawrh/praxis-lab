[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-ai-gateway-lab"
version = "0.0.1"
description = "Test-first reference implementation for Praxis AI Gateway on Red Hat OpenShift"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
